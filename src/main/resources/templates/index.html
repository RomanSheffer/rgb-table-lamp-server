<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <title>RGB Ночник</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="generator" content="Google Web Designer 16.4.1.0219">

  <style id="gwd-text-style">
    p, h1, h2, h3 { margin: 0px; }
  </style>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0px;
      padding: 0px;
    }

    body {
      background-image: -webkit-radial-gradient(center center, circle cover, rgb(84, 86, 130) 5%, rgb(48, 114, 132) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      padding: 20px;
      transition: background-color 0.4s ease, background-image 0.4s ease;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
      background: rgba(0, 0, 0, 0.25);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
    }

    .gwd-p-1vg4 {
      font-family: "Courier New", monospace;
      color: rgb(56, 183, 183);
      font-size: 22px;
      text-align: center;
      margin-bottom: 30px;
    }

    .control-row {
      display: flex;
      align-items: center;
      width: 100%;
      margin-bottom: 20px;
    }

    .color-label {
      font-family: "Courier New", monospace;
      width: 80px;
      font-size: 24px;
      font-weight: bold;
    }
    .red-label { color: rgb(208, 54, 28); }
    .green-label { color: rgb(77, 194, 89); }
    .blue-label { color: rgb(78, 105, 229); }

    .slider-input {
      flex: 1;
      height: 24px;
      cursor: pointer;
    }

    .buttons-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      margin-top: 15px;
    }

    .gwd-button-1vot {
      width: 100%;
      max-width: 200px;
      height: 60px;
      font-family: "Courier New", monospace;
      font-size: 23px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      transition: background-color 0.4s, transform 0.1s, box-shadow 0.4s, opacity 0.4s;
    }

    .gwd-button-1vot:disabled {
      background-color: #555555 !important;
      color: #aaaaaa !important;
      border: 2px solid #333333 !important;
      box-shadow: none !important;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .gwd-button-1cnm {
      width: 100%;
      max-width: 250px;
      height: 45px;
      font-family: "Courier New", monospace;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #fff;
      transition: all 0.3s ease;
    }

    #lamp_status_label {
      font-family: "Courier New", monospace;
      font-size: 16px;
      color: #ffffff;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="app-container">

  <h1 class="gwd-p-1vg4">HTML страничка для RGB ночника</h1>

  <div class="control-row">
    <span class="color-label red-label">RED</span>
    <input type="range" id="range_red" value="50" min="0" max="100" step="1" class="slider-input">
  </div>

  <div class="control-row">
    <span class="color-label green-label">GREEN</span>
    <input type="range" id="range_green" value="50" min="0" max="100" step="1" class="slider-input">
  </div>

  <div class="control-row">
    <span class="color-label blue-label">BLUE</span>
    <input type="range" id="range_blue" value="50" min="0" max="100" step="1" class="slider-input">
  </div>

  <div class="buttons-block">
    <button id="button_active" class="gwd-button-1vot" disabled>Ожидание...</button>
    <button id="button_avaiable" class="gwd-button-1cnm">Проверить состояние</button>
  </div>

</div>

<script>
  const redSlider = document.getElementById('range_red');
  const greenSlider = document.getElementById('range_green');
  const blueSlider = document.getElementById('range_blue');
  const button = document.getElementById('button_active');
  const btnCheck = document.getElementById('button_avaiable');
  const buttonsBlock = document.querySelector('.buttons-block');

  let isLampActive = false;
  let isWorking = false;
  let hasConnection = false;
  let debounceTimeout = null;

  button.style.transition = 'background-color 0.4s, transform 0.1s, box-shadow 0.4s';

  const statusText = document.createElement('div');
  statusText.id = 'lamp_status_label';
  statusText.innerText = 'Статус: неизвестно';
  buttonsBlock.appendChild(statusText);

  function updateBackgroundColor() {
    const rBytes = Math.round(redSlider.value * 2.55);
    const gBytes = Math.round(greenSlider.value * 2.55);
    const bBytes = Math.round(blueSlider.value * 2.55);

    if (isLampActive && hasConnection) {
      document.body.style.backgroundImage = 'none';
      document.body.style.backgroundColor = `rgb(${rBytes}, ${gBytes}, ${bBytes})`;
    } else {
      document.body.style.backgroundImage = '-webkit-radial-gradient(center center, circle cover, rgb(84, 86, 130) 5%, rgb(48, 114, 132) 100%)';
    }
  }

  function updateButtonUI() {
    if (hasConnection) {
      button.disabled = false;
      if (isWorking) {
        button.innerText = 'вкл/выкл';
        button.style.backgroundColor = '#4dff4d';
        button.style.color = '#000000';
        button.style.border = '2px solid #00cc00';
        button.style.boxShadow = '0 0 15px rgba(77, 255, 77, 0.6)';
        statusText.innerText = 'Статус: Лампа включена';
      } else {
        button.innerText = 'вкл/выкл';
        button.style.backgroundColor = '#ff4d4d';
        button.style.color = '#ffffff';
        button.style.border = '2px solid #cc0000';
        button.style.boxShadow = 'none';
        statusText.innerText = 'Статус: Лампа выключена';
      }
    } else {
      button.disabled = true;
      button.innerText = 'Нет связи';
      statusText.innerText = 'Статус: Ошибка подключения';
    }
    updateBackgroundColor();
  }

  function sendDataToBackend() {
    if (!hasConnection) return;

    const payload = {
      r: parseInt(redSlider.value),
      g: parseInt(greenSlider.value),
      b: parseInt(blueSlider.value),
      isActive: isLampActive,
      isWorking: isWorking
    };

    fetch('/api/lamp', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    })
            .then(response => {
              if (!response.ok) console.error('Ошибка отправки пакета данных');
            })
            .catch(error => {
              console.error('Критическая ошибка сети:', error);
              hasConnection = false;
              updateButtonUI();
            });
  }

  function onSliderChangeDebounced() {
    updateBackgroundColor();

    clearTimeout(debounceTimeout);

    debounceTimeout = setTimeout(() => {
      sendDataToBackend();
    }, 100);
  }

  redSlider.addEventListener('input', onSliderChangeDebounced);
  greenSlider.addEventListener('input', onSliderChangeDebounced);
  blueSlider.addEventListener('input', onSliderChangeDebounced);

  button.addEventListener('click', () => {
    if (!hasConnection) return;

    isWorking = !isWorking;
    button.style.transform = 'scale(0.95)';
    setTimeout(() => button.style.transform = 'scale(1)', 100);
    updateButtonUI();
    sendDataToBackend();
  });

  function checkLampStatus(isAuto = false) {
    if (!isAuto) {
      btnCheck.innerText = 'Запрос...';
      btnCheck.style.backgroundColor = '#ffcc00';
      btnCheck.style.color = '#000000';
    }

    fetch('/api/lamp/status')
            .then(res => {
              if (!res.ok) throw new Error('Сервер вернул ошибку');
              return res.json();
            })
            .then(state => {
              hasConnection = true;
              isLampActive = state.isActive;
              isWorking = state.isWorking;

              if(state.r !== undefined) redSlider.value = state.r;
              if(state.g !== undefined) greenSlider.value = state.g;
              if(state.b !== undefined) blueSlider.value = state.b;

              if (!isAuto) {
                btnCheck.innerText = 'Проверить состояние';
                btnCheck.style.backgroundColor = '#fff';
                btnCheck.style.color = '#000';
              }
              updateButtonUI();
            })
            .catch(error => {
              console.error('Ошибка опроса:', error);
              hasConnection = false;
              if (!isAuto) {
                btnCheck.innerText = 'Ошибка!';
                btnCheck.style.backgroundColor = '#ff4d4d';
                btnCheck.style.color = '#fff';
              }
              updateButtonUI();
            });
  }

  btnCheck.addEventListener('click', () => checkLampStatus(false));
  checkLampStatus(true);

  setInterval(() => checkLampStatus(true), 5000);
</script>

</body>
</html>
